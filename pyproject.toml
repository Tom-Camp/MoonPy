[project]
name = "moonpy"
version = "0.1.0"
description = "A library for calculating the phases of the moon."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tom Camp", email = "tomcamp@protonmail.ch.com" }
]
requires-python = ">=3.11"
dependencies = []
keywords = ["moon", "lunar", "moon phase", "astronomy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Tom-Camp/MoonPy"
Repository = "https://github.com/Tom-Camp/MoonPy"
Issues = "https://github.com/Tom-Camp/MoonPy/issues"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.mypy]
strict = true
