[project]
name = "moonpy"
version = "0.1.0"
description = "A library for calculating the phases of the moon."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tom Camp", email = "tom.camp@civicactions.com" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
