# Pre-commit hooks for a Python library, run with prek (https://github.com/j178/prek).
# Install:  prek install        Run all:  prek run --all-files
# Update revs:  prek autoupdate
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
fail_fast: false

repos:
  # prek ships these natively in Rust: no clone, no Python env.
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # Lint + format. Linter runs first so --fix output gets formatted.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Keeps uv.lock in sync with pyproject.toml. Delete if you don't use uv.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      - id: uv-lock

  # Catches malformed pyproject.toml before a broken build/publish.
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.27
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos

  # Type checking runs against your installed deps, so use the project env
  # instead of an isolated hook env (which would lack your dependencies).
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        exclude: ^(docs|tests)/
        require_serial: true
        pass_filenames: false
        args: [src]
